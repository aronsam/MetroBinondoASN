<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro Supermarket Binondo - ASN</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #004b93;
            --primary-hover: #003366;
            --accent: #d9251d;
            --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --focus-ring: rgba(0, 75, 147, 0.15);
            --danger: #ef4444;
            --success: #10b981;
            --success-hover: #059669;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px 8px;
            color: var(--text-main);
        }

        .container {
            background-color: var(--card-bg);
            padding: 24px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 720px;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px dashed #e2e8f0;
        }

        .header .badge {
            display: inline-block;
            background-color: rgba(217, 37, 29, 0.1);
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 8px;
        }

        .header h1 {
            color: var(--primary);
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        .form-group label {
            margin-bottom: 6px;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-main);
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        .custom-date-group {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 6px;
        }

        .po-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .po-section-header h3 {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
        }

        .po-table-wrapper {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow-x: auto;
            background-color: #ffffff;
            margin-bottom: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .po-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 480px;
        }

        .po-table th {
            background-color: #f1f5f9;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 10px 8px;
            text-align: left;
        }

        .po-table td {
            padding: 8px 6px;
            border-top: 1px solid #f1f5f9;
        }

        .po-table input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
        }

        .po-table input[name="poNumber[]"] {
           min-width: 120px;
           max-width: 160px; /* Pigilan ang sobrang paghaba */
        }

        .po-table input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .row-animation {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-add {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }

        .btn-add:hover {
            background-color: var(--success-hover);
        }

        .btn-delete {
            background-color: #fee2e2;
            color: var(--danger);
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }

        .btn-delete:hover {
            background-color: var(--danger);
            color: white;
        }

        .summary-card {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .summary-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .summary-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 75, 147, 0.25);
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px 4px;
            }
            .container {
                padding: 16px 12px;
                border-radius: 12px;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
            .custom-date-group {
                grid-template-columns: 1fr;
            }
            .form-group input, .form-group select, .po-table input {
                padding: 12px 10px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="badge">Binondo Branch</span>
            <h1>Metro Supermarket</h1>
            <p>Advance Shipping Notice (ASN) Form</p>
        </div>

        <form id="asnForm">
            
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="supplierName">Supplier Name</label>
                    <input type="text" id="supplierName" placeholder="Pangalan ng Kompanya / Supplier" required>
                </div>

                <div class="form-group">
                    <label for="contactNumber">Contact Number</label>
                    <input type="tel" id="contactNumber" placeholder="09XX XXX XXXX" required>
                </div>

                <div class="form-group">
                    <label>Date of Delivery (Month / Day / Year)</label>
                    <div class="custom-date-group">
                        <select id="delMonth" required>
                            <option value="">Month</option>
                            <option value="January">January</option>
                            <option value="February">February</option>
                            <option value="March">March</option>
                            <option value="April">April</option>
                            <option value="May">May</option>
                            <option value="June">June</option>
                            <option value="July">July</option>
                            <option value="August" selected>August</option>
                            <option value="September">September</option>
                            <option value="October">October</option>
                            <option value="November">November</option>
                            <option value="December">December</option>
                        </select>
                        <input type="number" id="delDay" placeholder="Day" min="1" max="31" value="8" required>
                        <input type="number" id="delYear" placeholder="Year" min="2026" max="2030" value="2026" required>
                    </div>
                </div>
            </div>

            <div class="po-section-header">
                <h3>Purchase Orders (PO) Details</h3>
                <button type="button" class="btn-add" onclick="addRow()">+ Add PO Row</button>
            </div>
            
            <div class="po-table-wrapper">
                <table class="po-table">
                    <thead>
                        <tr>
                            <th style="width: 40%;">P.O. Number</th>
                            <th style="width: 45%;">No. Of Boxes</th>
                            <th style="width: 15%; text-align: center;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="poTableBody">
                        <tr class="row-animation">
                            <td><input type="text" maxlength="12" name="poNumber[]" inputmode="numeric" placeholder="xxxxxxxx" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required></td>
                            <td><input type="text" name="noOfBoxes[]" inputmode="numeric" class="box-input" placeholder="0" oninput="this.value = this.value.replace(/[^0-9]/g, ''); calculateTotal();" required></td>
                            <td style="text-align: center;"><button type="button" class="btn-delete" onclick="removeRow(this)">Remove</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="summary-card">
                <div>
                    <span class="summary-label">Total PO Items</span>
                    <div class="summary-value" id="totalPoCount">1</div>
                </div>
                <div style="text-align: right;">
                    <span class="summary-label">Total Boxes Count</span>
                    <div class="summary-value" id="totalBoxesCount">0</div>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Submit ASN Request</button>
            
        </form>
    </div>

   <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxvzkMViQWWzrFRmJ4GoNAG5bCHAs96zds0TNfLiExNvFxF0yb9LMJenPhtXveGsudG/exec";

    // Auto-fill ng kasalukuyang petsa kapag binuksan ang page
    function setCurrentDate() {
        const today = new Date();
        const monthNames = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];
        
        document.getElementById('delMonth').value = monthNames[today.getMonth()];
        document.getElementById('delDay').value = today.getDate();
        document.getElementById('delYear').value = today.getFullYear();
    }

    // Patakbuhin kapag nabasa na ng browser ang HTML
    window.addEventListener('DOMContentLoaded', setCurrentDate);

    function addRow() {
        const tableBody = document.getElementById('poTableBody');
        const newRow = document.createElement('tr');
        newRow.className = 'row-animation';

        newRow.innerHTML = `
            <td><input type="text" name="poNumber[]" placeholder="hal. 1234567890" required></td>
            <td><input type="number" name="noOfBoxes[]" class="box-input" min="1" placeholder="0" oninput="calculateTotal()" required></td>
            <td style="text-align: center;"><button type="button" class="btn-delete" onclick="removeRow(this)">Remove</button></td>
        `;

        tableBody.appendChild(newRow);
        updateSummary();
    }

    function removeRow(button) {
        const tableBody = document.getElementById('poTableBody');
        if (tableBody.getElementsByTagName('tr').length > 1) {
            button.closest('tr').remove();
            calculateTotal();
            updateSummary();
        } else {
            alert("Kailangan ng kahit isang P.O. Number.");
        }
    }

    function calculateTotal() {
        const boxInputs = document.querySelectorAll('.box-input');
        let total = 0;

        boxInputs.forEach(input => {
            const val = parseInt(input.value);
            if (!isNaN(val)) {
                total += val;
            }
        });

        document.getElementById('totalBoxesCount').innerText = total;
    }

    function updateSummary() {
        const poCount = document.querySelectorAll('#poTableBody tr').length;
        document.getElementById('totalPoCount').innerText = poCount;
    }

    document.getElementById('asnForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "Saving...";

        const supplierName = document.getElementById('supplierName').value;
        const contactNumber = document.getElementById('contactNumber').value;
        const month = document.getElementById('delMonth').value;
        const day = document.getElementById('delDay').value;
        const year = document.getElementById('delYear').value;
        const deliveryDate = `${month} ${day}, ${year}`;

        const poNumbers = document.querySelectorAll('input[name="poNumber[]"]');
        const boxCounts = document.querySelectorAll('input[name="noOfBoxes[]"]');
        
        let poDetails = [];
        let totalBoxes = 0;

        poNumbers.forEach((poInput, index) => {
            const boxes = parseInt(boxCounts[index].value) || 0;
            poDetails.push({
                poNumber: poInput.value,
                boxes: boxes
            });
            totalBoxes += boxes;
        });

        const payload = {
            supplierName: supplierName,
            contactNumber: contactNumber,
            deliveryDate: deliveryDate,
            poDetails: poDetails,
            totalBoxes: totalBoxes
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        })
       .then(() => {
            alert(`ASN Successfully Submit and Save, Receiving Time:

Monday to Saturday: 8:00 AM – 3:00 PM

Sunday: 8:00 AM – 12:00 PM \n\nDelivery Date: ${deliveryDate}`);
            
            // Isang linya na lang ang kailangan para linisin at i-refresh ang buong page:
            location.reload();
        })
        .catch(error => {
            console.error("Error!", error.message);
            alert("Nagkaroon ng problema sa pag-save. Paki-subukan ulit.");
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit ASN Request";
        });
    });
</script>

</body>
</html>
