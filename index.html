<!DOCTYPE html>
<html lang="tl">
<head>
    <!-- === META PREVIEW FOR FACEBOOK, VIBER, MESSENGER, ETC. === -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Metro Supermarket Binondo - ASN Form">
    <meta property="og:description" content="Advance Shipping Notice (ASN) Booking Form for Metro Supermarket Binondo Branch.">
    <meta property="og:image" content="https://aronsam.github.io/MetroBinondoASN/metrologo.png">
    <meta property="og:url" content="https://aronsam.github.io/MetroBinondoASN/index.html">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Metro Supermarket Binondo - ASN Form">
    <meta name="twitter:description" content="Advance Shipping Notice (ASN) Booking Form for Metro Supermarket Binondo Branch.">
    <meta name="twitter:image" content="https://aronsam.github.io/MetroBinondoASN/metrologo.png">

    <!-- Favicon para sa Browser Tab -->
    <link rel="icon" type="image/png" href="metrologo.png">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro Supermarket Binondo - ASN</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #004b93;
            --primary-hover: #003366;
            --accent: #d9251d;
            --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --focus-ring: rgba(0, 75, 147, 0.15);
            --danger: #ef4444;
            --success: #10b981;
            --success-hover: #059669;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px 8px;
            color: var(--text-main);
        }

        .container {
            background-color: var(--card-bg);
            padding: 24px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 720px;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .header {
            display: flex;
            align-items: center;
            position: relative;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px dashed #e2e8f0;
        }

        .header-logo {
            width: 130px;
            height: 130px;
            object-fit: contain;
            position: absolute;
            left: 0;
        }

        .header-content {
            width: 100%;
            text-align: center;
            padding-left: 20px;
            padding-right: 20px;
        }

        .header .badge {
            display: inline-block;
            background-color: rgba(217, 37, 29, 0.1);
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 6px;
        }

        .header h1 {
            color: var(--primary);
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 2px;
            line-height: 1.2;
        }

        .header p {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        .form-group label {
            margin-bottom: 6px;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-main);
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        .custom-date-group {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 6px;
        }

        .po-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .po-section-header h3 {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
        }

        .po-table-wrapper {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow-x: auto;
            background-color: #ffffff;
            margin-bottom: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .po-table input.box-input {
            width: 90px;
            text-align: center;
        }

        .po-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 100%;
        }

        .po-table th {
            background-color: #f1f5f9;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 10px 8px;
            text-align: left;
        }

        .po-table td {
            padding: 8px 6px;
            border-top: 1px solid #f1f5f9;
        }

        .po-table input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
        }

        .po-table th:nth-child(1) { width: 50%; }
        .po-table th:nth-child(2) { width: 30%; }
        .po-table th:nth-child(3) { width: 20%; text-align: center; }

        .po-table input[name="poNumber[]"] {
            width: 100%;
        }

        .po-table input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .row-animation {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-add {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }

        .btn-add:hover {
            background-color: var(--success-hover);
        }

        .btn-delete {
            background-color: #fee2e2;
            color: var(--danger);
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }

        .btn-delete:hover {
            background-color: var(--danger);
            color: white;
        }

        .summary-card {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .summary-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .summary-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 75, 147, 0.25);
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-verify {
            width: 100%;
            background-color: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .btn-verify:hover {
            background-color: rgba(0, 75, 147, 0.08);
            border-color: var(--primary-hover);
            color: var(--primary-hover);
        }

        /* --- MODAL STYLES --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 440px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            transform: scale(0.95);
            transition: transform 0.2s ease;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-header {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 12px;
            text-align: center;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .btn-modal-close {
            background-color: #e2e8f0;
            color: var(--text-main);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            flex: 1;
            cursor: pointer;
        }

        .btn-modal-confirm {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            flex: 1;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            body { padding: 10px 4px; }
            .container { padding: 16px 12px; border-radius: 12px; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
            .custom-date-group { grid-template-columns: 1fr; }
            .form-group input, .form-group select, .po-table input { padding: 12px 10px; font-size: 15px; }
            .header-logo { width: 70px; height: 70px; }
            .header-content { padding: 0 70px;}
            .header h1 { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <img src="metrologo.png" alt="Metro Logo" class="header-logo">
            <div class="header-content">
                <span class="badge">Binondo Branch</span>
                <h1>Metro Supermarket</h1>
                <p>Advance Shipping Notice (ASN) Form</p>
            </div>
        </div>

        <form id="asnForm">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="supplierName">Supplier Name</label>
                    <input type="text" id="supplierName" placeholder="Pangalan ng Kompanya / Supplier" required>
                </div>

                <div class="form-group">
                    <label for="contactNumber">Contact Number</label>
                    <input type="tel" id="contactNumber" placeholder="09XXXXXXXXX" maxlength="11" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '');" required>
                </div>

                <div class="form-group">
                    <label>Date of Delivery (Month / Day / Year)</label>
                    <div class="custom-date-group">
                        <select id="delMonth" required>
                            <option value="">Month</option>
                            <option value="January">January</option>
                            <option value="February">February</option>
                            <option value="March">March</option>
                            <option value="April">April</option>
                            <option value="May">May</option>
                            <option value="June">June</option>
                            <option value="July">July</option>
                            <option value="August">August</option>
                            <option value="September">September</option>
                            <option value="October">October</option>
                            <option value="November">November</option>
                            <option value="December">December</option>
                        </select>
                        <input type="number" id="delDay" placeholder="Day" min="1" max="31" required>
                        <input type="number" id="delYear" placeholder="Year" min="2026" max="2030" required>
                    </div>
                </div>
            </div>

            <div class="po-section-header">
                <h3>Purchase Orders (PO) Details</h3>
                <button type="button" class="btn-add" onclick="addRow()">+ Add PO Row</button>
            </div>
            
            <div class="po-table-wrapper">
                <table class="po-table">
                    <thead>
                        <tr>
                            <th style="width: 45%;">P.O. Number</th>
                            <th style="width: 40%;">No. Of Boxes</th>
                            <th style="width: 15%; text-align: center;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="poTableBody">
                        <tr class="row-animation">
                            <td><input type="text" maxlength="12" name="poNumber[]" inputmode="numeric" placeholder="xxxxxxxx" oninput="this.value = this.value.replace(/[^0-9]/g, ''); calculateTotal();" required></td>
                            <td><input type="text" name="noOfBoxes[]" inputmode="numeric" class="box-input" placeholder="0" oninput="this.value = this.value.replace(/[^0-9]/g, ''); calculateTotal();" required></td>
                            <td style="text-align: center;"><button type="button" class="btn-delete" onclick="removeRow(this)">Remove</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="summary-card">
                <div>
                    <span class="summary-label">Total PO Items</span>
                    <div class="summary-value" id="totalPoCount">0</div>
                </div>
                <div style="text-align: right;">
                    <span class="summary-label">Total Boxes Count</span>
                    <div class="summary-value" id="totalBoxesCount">0</div>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Submit ASN Request</button>
            <button type="button" id="verifyBtn" class="btn-verify" onclick="openVerifyModal()">Verify your ASN</button>
        </form>
    </div>

    <!-- 1. MODAL PARA SA INPUT NG VERIFICATION -->
    <div class="modal-overlay" id="verifyInputModal">
        <div class="modal-card">
            <div class="modal-header">Verify Your ASN</div>
            <div class="modal-body">
                <div class="form-group" style="margin-bottom: 12px;">
                    <label for="vContactNumber">Contact Number</label>
                    <input type="tel" id="vContactNumber" placeholder="09XXXXXXXXX" maxlength="11" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
                </div>
                <div class="form-group">
                    <label>Date of Delivery</label>
                    <div class="custom-date-group">
                        <select id="vDelMonth">
                            <option value="">Month</option>
                            <option value="January">January</option>
                            <option value="February">February</option>
                            <option value="March">March</option>
                            <option value="April">April</option>
                            <option value="May">May</option>
                            <option value="June">June</option>
                            <option value="July">July</option>
                            <option value="August">August</option>
                            <option value="September">September</option>
                            <option value="October">October</option>
                            <option value="November">November</option>
                            <option value="December">December</option>
                        </select>
                        <input type="number" id="vDelDay" placeholder="Day" min="1" max="31">
                        <input type="number" id="vDelYear" placeholder="Year" min="2026" max="2030">
                    </div>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-modal-close" onclick="closeModal('verifyInputModal')">Cancel</button>
                <button type="button" class="btn-modal-confirm" id="btnConfirmVerify" onclick="processVerification()">Verify</button>
            </div>
        </div>
    </div>

    <!-- 2. MODAL PARA SA RESULTA -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-card" style="text-align: center;">
            <div class="modal-header" id="resultHeader">Status</div>
            <div class="modal-body" id="resultBody" style="font-size: 14px; line-height: 1.5; color: var(--text-main);"></div>
            <button type="button" class="btn-modal-confirm" style="width: 100%;" onclick="closeModal('resultModal')">OK</button>
        </div>
    </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby7EFG9yBA6I_roBZchL0KhU0IiIpTHR4NAADM38PK8gBuKBR9JCItSEnqc5kR-fp4e/exec";

    window.addEventListener('DOMContentLoaded', () => {
        calculateTotal();
    });

    // Function para suriin kung totoong umiiral ang petsa
    function isValidDate(monthName, day, year) {
        const months = [
            "January", "February", "March", "April", "May", "June", 
            "July", "August", "September", "October", "November", "December"
        ];
        
        const monthIndex = months.indexOf(monthName);
        if (monthIndex === -1) return false;
        
        const numDay = Number(day);
        const numYear = Number(year);
        
        if (isNaN(numDay) || isNaN(numYear) || numDay <= 0) return false;
        
        const testDate = new Date(numYear, monthIndex, numDay);
        
        return testDate.getFullYear() === numYear && 
               testDate.getMonth() === monthIndex && 
               testDate.getDate() === numDay;
    }

    // Function para suriin kung ang petsa ay BUKAS O SUSUNOD PA (Bawal ngayon at nakalipas na petsa)
    function isFutureDate(monthName, day, year) {
        const months = [
            "January", "February", "March", "April", "May", "June", 
            "July", "August", "September", "October", "November", "December"
        ];
        
        const monthIndex = months.indexOf(monthName);
        const numDay = Number(day);
        const numYear = Number(year);

        const selectedDate = new Date(numYear, monthIndex, numDay);
        selectedDate.setHours(0, 0, 0, 0);

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        // Kakailanganin na ang napiling petsa ay HIGIT PA sa ngayong araw (bukas pataas)
        return selectedDate > today;
    }

    function addRow() {
        const tableBody = document.getElementById('poTableBody');
        const newRow = document.createElement('tr');
        newRow.className = 'row-animation';

        newRow.innerHTML = `
            <td><input type="text" name="poNumber[]" placeholder="xxxxxxxx" maxlength="12" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, ''); calculateTotal();" required></td>
            <td><input type="text" name="noOfBoxes[]" class="box-input" inputmode="numeric" placeholder="0" oninput="this.value = this.value.replace(/[^0-9]/g, ''); calculateTotal();" required></td>
            <td style="text-align: center;"><button type="button" class="btn-delete" onclick="removeRow(this)">Remove</button></td>
        `;

        tableBody.appendChild(newRow);
        calculateTotal();
    }

    function removeRow(button) {
        const tableBody = document.getElementById('poTableBody');
        if (tableBody.getElementsByTagName('tr').length > 1) {
            button.closest('tr').remove();
            calculateTotal();
        } else {
            alert("Kailangan ng kahit isang P.O. Number.");
        }
    }

    function calculateTotal() {
        const rows = document.querySelectorAll('#poTableBody tr');
        let filledPoCount = 0;
        let totalBoxes = 0;

        rows.forEach(row => {
            const poInput = row.querySelector('input[name="poNumber[]"]');
            const boxInput = row.querySelector('input[name="noOfBoxes[]"]');

            const poValue = poInput ? poInput.value.trim() : '';
            const boxValue = boxInput ? parseInt(boxInput.value, 10) : 0;

            if (poValue !== '' || (!isNaN(boxValue) && boxValue > 0)) {
                filledPoCount++;
            }

            if (!isNaN(boxValue) && boxValue > 0) {
                totalBoxes += boxValue;
            }
        });

        document.getElementById('totalPoCount').innerText = filledPoCount;
        document.getElementById('totalBoxesCount').innerText = totalBoxes;
    }

    function openVerifyModal() {
        document.getElementById('vContactNumber').value = "";
        document.getElementById('vDelMonth').value = "";
        document.getElementById('vDelDay').value = "";
        document.getElementById('vDelYear').value = "";
        document.getElementById('verifyInputModal').classList.add('active');
    }

    function closeModal(modalId) {
        const targetModal = document.getElementById(modalId);
        if (targetModal) {
            targetModal.classList.remove('active');
        }
    }

    function processVerification() {
        const contact = document.getElementById('vContactNumber').value.trim();
        const month = document.getElementById('vDelMonth').value;
        const day = document.getElementById('vDelDay').value;
        const year = document.getElementById('vDelYear').value;

        if (!contact || !month || !day || !year) {
            alert("Paki-kumpleto ang Contact Number at Delivery Date para sa verification.");
            return;
        }

        // 1. Valid date check
        if (!isValidDate(month, day, year)) {
            alert(`Maling Petsa! Ang ${month} ay walang araw na ${day}. Paki-ayos bago mag-patuloy.`);
            document.getElementById('vDelDay').focus();
            return;
        }

        const deliveryDate = `${month} ${day}, ${year}`;

        const btnConfirm = document.getElementById('btnConfirmVerify');
        btnConfirm.disabled = true;
        btnConfirm.innerText = "Checking...";

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
                action: "verify",
                contactNumber: contact,
                deliveryDate: deliveryDate
            })
        })
        .then(res => res.json())
        .then(data => {
            closeModal('verifyInputModal');
            
            if (data.status === "found") {
                document.getElementById('resultHeader').innerText = "ASN Confirmed!";
                document.getElementById('resultHeader').style.color = "var(--success)";
                document.getElementById('resultBody').innerHTML = `Your ASN on <b>${deliveryDate}</b> has been booked.<br><br><b>Receiving Time is 8 AM to 3 PM only.</b>`;
            } else {
                document.getElementById('resultHeader').innerText = "Not Found";
                document.getElementById('resultHeader').style.color = "var(--danger)";
                document.getElementById('resultBody').innerHTML = `Walang nahanap na booking para sa contact number na <b>${contact}</b> sa petsang <b>${deliveryDate}</b>.`;
            }
            
            document.getElementById('resultModal').classList.add('active');
        })
        .catch(err => {
            console.error(err);
            alert("Nagkaroon ng error sa pag-verify. Paki-subukan ulit.");
        })
        .finally(() => {
            btnConfirm.disabled = false;
            btnConfirm.innerText = "Verify";
        });
    }

    // --- FORM SUBMIT EVENT LISTENER ---
    document.getElementById('asnForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const supplierName = document.getElementById('supplierName').value.trim();
        const contactNumber = document.getElementById('contactNumber').value.trim();
        const month = document.getElementById('delMonth').value;
        const day = document.getElementById('delDay').value.trim();
        const year = document.getElementById('delYear').value.trim();

        // 1. Pagsuri kung may kulang na fields
        if (!supplierName || !contactNumber || !month || !day || !year) {
            alert("Paki-kumpleto muna ang Supplier Name, Contact Number, at kumpletong Delivery Date.");
            return;
        }

        // 2. ISAGAWA ANG DATE VALIDATION CHECK (Umiiral na petsa)
        if (!isValidDate(month, day, year)) {
            alert(`Maling Petsa! Ang ${month} ay walang araw na ${day}. Paki-ayos bago mag-patuloy.`);
            document.getElementById('delDay').focus();
            return;
        }

        // 3. CHECK KUNG BUKAS PATAAS ANG PETSA (Bawal ngayong araw o nakalipas na petsa)
        if (!isFutureDate(month, day, year)) {
            alert("Bawal mag-book ngayong araw o sa mga nakalipas na petsa. Ang pwede lang i-book ay simula bukas pataas.");
            document.getElementById('delDay').focus();
            return;
        }

        // 4. KUNG VALID AT PASOK SA CONDITION: Patuloy na ipapadala sa Google Apps Script
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "Saving...";

        const deliveryDate = `${month} ${day}, ${year}`;
        const poNumbers = document.querySelectorAll('input[name="poNumber[]"]');
        const boxCounts = document.querySelectorAll('input[name="noOfBoxes[]"]');
        
        let poDetails = [];
        let totalBoxes = 0;

        poNumbers.forEach((poInput, index) => {
            const boxes = parseInt(boxCounts[index].value) || 0;
            if (poInput.value.trim() !== "") {
                poDetails.push({
                    poNumber: poInput.value.trim(),
                    boxes: boxes
                });
                totalBoxes += boxes;
            }
        });

        const payload = {
            action: "submit",
            supplierName: supplierName,
            contactNumber: contactNumber,
            deliveryDate: deliveryDate,
            poDetails: poDetails,
            totalBoxes: totalBoxes
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
        })
        .then(() => {
            alert(`ASN Successfully Submit and Save, Receiving Time:\n\nMonday to Saturday: 8:00 AM – 3:00 PM\nSunday: 8:00 AM – 12:00 PM \n\nDelivery Date: ${deliveryDate}`);
            location.reload();
        })
        .catch(error => {
            console.error("Error!", error.message);
            alert("Nagkaroon ng problema sa pag-save. Paki-subukan ulit.");
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit ASN Request";
        });
    });
</script>

</html>
